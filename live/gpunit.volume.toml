# The window `make live-volume` opens: a 10 GB volume for 30m, and two pods that mount it in turn.
project = "live-volume"
# Pushed by hand for linux/amd64; a rebuild moves the digest.
image = "ghcr.io/alxb1t/gpunit-live@sha256:dc4c26e875a2871bcc8a1004ded0371dec362fddf77088f95a929afea3a9a2fc"
# The cheapest secure-cloud cards in stock, tried in order; stock moves by the hour. A window
# needs a card in stock where standard volumes are, so dearer cards follow the cheap ones.
gpus = [
  "NVIDIA RTX A4500",
  "NVIDIA RTX A5000",
  "NVIDIA A40",
  "NVIDIA RTX A6000",
  "NVIDIA RTX PRO 4500 Blackwell",
  "NVIDIA GeForce RTX 4090",
]
vram_gb = 16
max_hourly = 0.90
ceiling = "10m"
disk_gb = 10
volume_gb = 10
volume_ceiling = "30m"
